

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="admin.css">
  <title>Gestión de Reservas</title>
</head>
<body>
  <h1>Gestión de Reservas</h1>
  <label for="filtroGrado">Filtrar por grado:</label>
  <select id="filtroGrado">
    <option value="">Todos</option>
  </select>

  <label for="filtroCurso">Filtrar por curso:</label>
  <select id="filtroCurso">
    <option value="">Todos</option>
  </select>

  <table id="tablaReservas">
    <thead>
      <tr>
        <th>Nombre</th><th>Ciclo</th><th>Grado</th><th>Curso</th><th>Hora</th><th>Modalidad</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="modalEditar" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
    <div style="background:#fff; padding:20px; margin:100px auto; width:400px; border-radius:8px;">
      <h2>Editar Reserva</h2>
      <input type="text" id="editNombre" placeholder="Nombre">
      <select id="editCiclo"></select>
      <select id="editGrado"></select>
      <select id="editCurso"></select>
      <input type="text" id="editHora" placeholder="Hora">
      <label for="editModalidad">Modalidad</label>
      <select id="editModalidad">
        <option value="Presencial">Presencial</option>
        <option value="Virtual">Virtual</option>
      </select>
      <button onclick="guardarEdicion()">Guardar</button>
      <button onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <scrip src="admin.js"></script>
</body>
</html>
