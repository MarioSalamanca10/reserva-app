
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Reservas</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header>
    <h1>Gestión de Reservas</h1>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </header>

  <div class="menu-navegacion">
    <button onclick="mostrarSeccion('tablaReservas')">Reservas Generales</button>
    <button onclick="mostrarSeccion('tablaAsignaturas')">Reservas por Asignatura</button>
  </div>

  <div id="tablaReservas" class="seccion-tabla" style="display: none;">
    <div class="filtros">
      <label for="filtroGrado">Grado:</label>
      <select id="filtroGrado"></select>

      <label for="filtroCurso">Curso:</label>
      <select id="filtroCurso"></select>
    </div>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Ciclo</th>
            <th>Grado</th>
            <th>Curso</th>
            <th>Hora</th>
            <th>Modalidad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaReservas"></tbody>
      </table>
    </div>
  </div>

  <div id="tablaAsignaturas" class="seccion-tabla" style="display: none;">
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Materia</th>
            <th>Profesor</th>
            <th>Modalidad</th>
            <th>Hora</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaAsignaturas"></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
