
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="admin.css">
  <title>Gestión de Reservas</title>
</head>
<body>
  <h1>Gestión de Reservas</h1>
  <label for="filtroCurso">Filtrar por curso:</label>
  <select id="filtroCurso">
    <option value="">Todos</option>
    <option value="A">Curso A</option>
    <option value="B">Curso B</option>
    <option value="C">Curso C</option>
  </select>

  <table id="tablaReservas">
    <thead>
      <tr>
        <th>Nombre</th><th>Ciclo</th><th>Grado</th><th>Curso</th><th>Hora</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="admin.js"></script>
</body>
</html>
