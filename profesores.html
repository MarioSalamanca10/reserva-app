
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="profesores.css">
  <title>Reservas por Profesor</title>
</head>
<body>
  <div class="container">
    <h1>Reservas por Profesor</h1>
    <div class="filters">
      <select id="filtroGrado">
        <option value="">Todos los grados</option>
      </select>
      <select id="filtroCurso">
        <option value="">Todos los cursos</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Ciclo</th>
          <th>Grado</th>
          <th>Curso</th>
          <th>Hora</th>
          <th>Modalidad</th>
        </tr>
      </thead>
      <tbody id="tablaReservas"></tbody>
    </table>
  </div>
  <!-- Tabla de reservas por asignatura -->
<h2>Reservas por Asignatura</h2>
<table id="tablaAsignaturas">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Materia</th>
      <th>Profesor</th>
      <th>Modalidad</th>
      <th>Hora</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
  <script src="profesores.js"></script>
</body>
</html>
